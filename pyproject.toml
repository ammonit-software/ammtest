[project]
name = "ammtest"
dynamic = ["version"]
description = "Python test framework for critical-software systems. Write, run, and trace system-level tests against any System Under Test (SUT)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pynng>=0.8.0",
]

[project.scripts]
ammtest = "ammtest.cli:main"

# Only used to verify ammtest itself; not a runtime dependency.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ammtest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ammtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
